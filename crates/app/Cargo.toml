[package]
name = "holdmyram"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
holdmyram-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
# Native open/save dialogs (JS: window.__TAURI__.dialog; Rust: pick_*_path commands).
tauri-plugin-dialog = "2"
# Already in the tree through wry; used only to ask whether the WebView2 runtime exists.
webview2-com = "0.39"
windows-core = "0.62"
# Notification child arguments (already in the tree through the core crate).
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Hold-to-confirm: GetAsyncKeyState.
    "Win32_UI_Input_KeyboardAndMouse",
    # Notification children only (never called in the tray process): pop-up drawing,
    # DPI, sound, AUMID registration, WinRT toast.
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # Sound child: GetSystemWindowsDirectoryW for %SystemRoot%\Media.
    "Win32_System_SystemInformation",
    "Data_Xml_Dom",
    "UI_Notifications",
]
