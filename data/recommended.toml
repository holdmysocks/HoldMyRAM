# HoldMyRAM built-in "Recommended" profiles: the generic rule list.
#
# This file is embedded in the binary (include_str!) and is NOT a fixed selection list.
# At apply time (and for the preview) HoldMyRAM takes these rules, keeps only what is
# actually running / present / enabled on this PC, and then drops anything that fails a
# safety check: the foreground app's process tree, HoldMyRAM itself, protected process
# names, protected directories (C:\Windows\...), the helper's never-touch services and task
# folders, and anything the risk database (data/risk.toml + the user's risk-user.toml)
# rates Dangerous.
#
# Profiles:
#   "Recommended"  uses the kind = "process" items only (never needs admin / UAC).
#   "Recommended+" uses every kind (services and tasks go through the admin helper).
#
# Default vs add-on:
#   An item is in the built-in profiles BY DEFAULT only when its group is not an add-on
#   group AND its confidence is not "low". Add-on groups:
#     "optional"  user-facing apps (Discord, Spotify, Steam, ...)
#     "optin"     everything else that is safe for some people but not for everyone
#   Add-ons are used only when the user turns them on (config `recommended_addons` for
#   single items, `recommended_addon_groups` for whole groups).
#
# Format (one [[item]] table per rule; unknown keys are rejected by a test):
#   kind        = "process" | "service" | "task"
#   name        = process: executable name ("GameBar.exe"), matched case-insensitively.
#                 service: short (key) name ("DiagTrack"). Per-user services are listed by
#                          their template name ("CDPUserSvc") and also match the running
#                          instance ("CDPUserSvc_8155c").
#                 task:    full task path ("\Microsoft\Windows\Maps\MapsUpdateTask").
#                          A single trailing "*" makes it a prefix match within the last
#                          path component (for tasks that carry a GUID or numbered suffix).
#   group       = one lowercase word. Default items: a descriptive tag ("xbox",
#                 "telemetry", ...). Add-ons: "optional" or "optin".
#   confidence  = "high"   a fetched source states it (docs/research-recommended.md)
#                 "medium" a script/snippet or well-known maintainer knowledge; names
#                          believed correct, not yet checked on a clean PC
#                 "low"    unverified candidate: never in the defaults (must be an add-on)
#   why         = one sentence: why it is safe to close/stop/disable temporarily.
#   side_effect = one sentence: what the user notices while it is off.
#   method      = optional, processes only: "close" (default), "suspend" or "kill".
#                 Services always "stop", tasks always "disable" (both temporary: undone
#                 when the toggle is turned off).
#   display     = optional friendly name.
#   condition   = optional, only act when it holds right now:
#                 "no_printer"  no physical printer is installed (virtual ones such as
#                               Microsoft Print to PDF do not count; unknown = skip).
#
# Never listed here (a test enforces it): the helper's never-touch services and task
# folders, protected process names, and the NEVER_RECOMMEND lists in profiles.rs (Windows
# Update and Edge update, security and repair tasks, Bluetooth, remote access, OEM control
# software).
#
# Adding an entry: copy a block, fill every field, run `cargo test -p holdmyram-core`.

format_version = 1

